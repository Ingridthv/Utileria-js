<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utileria JS - Formulario</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="contenedor">
    <h1>Registro</h1>

    <form id="formRegistro">
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Ej. Ingrid">
        <span class="error" id="errorNombre"></span>
      </div>

      <div class="campo">
        <label for="correo">Correo</label>
        <input type="text" id="correo" placeholder="Ej. ingrid@gmail.com">
        <span class="error" id="errorCorreo"></span>
      </div>

      <div class="campo">
        <label for="telefono">Teléfono (10 dígitos)</label>
        <input type="text" id="telefono" placeholder="Ej. 9511234567">
        <span class="error" id="errorTelefono"></span>
      </div>

      <div class="campo">
       <label for="fechaNacimiento">Fecha de nacimiento</label>
       <input type="date" id="fechaNacimiento" placeholder="Ej. 2000-05-10">
       <span class="error" id="errorFecha"></span>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder=" ">
        <span class="error" id="errorPassword"></span>
      </div>

      <button type="submit">Registrarme</button>
    </form>

    <div class="enlace">
      <a href="login.html">Inicia sesión</a>
    </div>
  </div>

  <div class="overlay" id="overlayModal">
    <div class="modal">
      <h2>Registro exitoso</h2>
      <p id="textoEdad"></p>
      <button id="cerrarModal">Cerrar</button>
    </div>
  </div>

  <script src="js/utileria.js"></script>
  <script src="js/registrate.js"></script>

</body>
</html>
