<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utileria JS - Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="contenedor">
    <h1>Iniciar sesión</h1>

    <form id="formLogin">
      <div class="campo">
        <label for="correo">Correo</label>
        <input type="text" id="correo" placeholder="Ej. ingrid@gmail.com">
        <span class="error" id="errorCorreo"></span>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder=" ">
        <span class="error" id="errorPassword"></span>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div class="enlace">
       <a href="index.html">Regístrate</a>
    </div>
  </div>

  <script src="js/utileria.js"></script>
  <script>
    var form = document.getElementById("formLogin");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var correo = document.getElementById("correo").value;
      var password = document.getElementById("password").value;

      document.getElementById("errorCorreo").textContent = "";
      document.getElementById("errorPassword").textContent = "";

      var valido = true;

      if (!validarCorreo(correo)) {
        document.getElementById("errorCorreo").textContent = "Correo no válido.";
        valido = false;
      }

      if (!validarPassword(password)) {
        document.getElementById("errorPassword").textContent = "Contraseña no válida.";
        valido = false;
      }

      if (valido) {
        console.log("Inicio de sesión correcto");
        console.log("Correo:", correo);
        alert("Bienvenido, inicio de sesión correcto.");
      }
    });
  </script>

</body>
</html>
